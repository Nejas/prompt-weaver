name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGPASSWORD: test-password
      IDENTITY_TEST_DB: identity_integration_test
      PROMPT_TEST_DSN: postgresql://postgres:test-password@localhost:5432/prompt_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate gRPC modules
        run: |
          mkdir -p generated
          touch generated/__init__.py
          python -m grpc_tools.protoc -Icontracts --python_out=generated --grpc_python_out=generated contracts/prompt.proto contracts/identity.proto contracts/rules.proto
      - name: Prepare test databases
        run: |
          createdb -h localhost -U postgres identity_integration_test
          createdb -h localhost -U postgres prompt_integration_test
          python -c "from pathlib import Path; s=Path('infrastructure/database/init/002-schema.sql').read_text(encoding='utf-8'); Path('/tmp/identity-schema.sql').write_text(s.split('\\\\connect prompts')[0].replace('\\\\connect identity',''), encoding='utf-8')"
          psql -h localhost -U postgres -d identity_integration_test -v ON_ERROR_STOP=1 -f /tmp/identity-schema.sql
          psql -h localhost -U postgres -d identity_integration_test -v ON_ERROR_STOP=1 -f infrastructure/database/migrations/identity/001_sessions.sql
      - name: Run tests
        run: python -m pytest -q

  android:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37"
      - name: Test and build Android
        run: bash gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --no-daemon

  ios:
    name: iOS simulator build
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow Xcode to run Gradle wrapper
        run: chmod +x gradlew
      - name: Test and build shared iOS simulator framework
        run: bash gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build iOS app for simulator
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
