services:
  gateway:
    build: .
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      PROMPT_SERVICE_ADDRESS: prompt-service:50051
      IDENTITY_SERVICE_ADDRESS: identity-service:50052
      RULES_SERVICE_ADDRESS: rules-service:50053
      BIFROST_URL: http://bifrost:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - prompt-service
      - identity-service
      - rules-service
  bifrost:
    image: maximhq/bifrost:v1.5.0
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./infrastructure/bifrost/config.json:/app/data/config.json:ro
  rules-service:
    build: .
    command: python -m services.rules_service.server
  prompt-service:
    build: .
    command: python -m services.prompt_service.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: prompts
      DB_USER: ${PROMPT_DB_USER:?Set PROMPT_DB_USER}
      DB_PASSWORD: ${PROMPT_DB_PASSWORD:?Set PROMPT_DB_PASSWORD}
  identity-service:
    build: .
    command: python -m services.identity_service.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: identity
      DB_USER: ${IDENTITY_DB_USER:?Set IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: prompts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/database/migrations:/app-migrations:ro
  redis:
    image: redis:7
volumes:
  postgres_data:
