syntax = "proto3";
package rules.v1;
service RulesService { rpc GetRuleSet(RuleSetRequest) returns (RuleSetResponse); }
message RuleSetRequest { string id = 1; }
message Rule { string id = 1; string text = 2; int32 order = 3; }
message RuleSetResponse { string id = 1; string name = 2; repeated Rule rules = 3; }
