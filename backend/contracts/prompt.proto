syntax = "proto3";

package prompt.v1;

service PromptService {
  rpc Compose(ComposeRequest) returns (ComposeResponse);
  rpc GetTemplate(TemplateRequest) returns (TemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
}

message TemplateRequest { string template_version_id = 1; }
message ParameterDefinition { string name = 1; string type = 2; bool required = 3; int32 max_length = 4; repeated string options = 5; string label = 6; }
message TemplateResponse { string id = 1; string body = 2; repeated ParameterDefinition parameters = 3; string title = 4; string description = 5; string category = 6; string slug = 7; }
message ListTemplatesRequest { int32 limit = 1; int32 offset = 2; }
message TemplateSummary { string id = 1; string title = 2; string description = 3; string category = 4; string slug = 5; }
message ListTemplatesResponse { repeated TemplateSummary templates = 1; }

message ComposeRequest {
  string template_version_id = 1;
  map<string, string> parameters = 2;
}

message ComposeResponse {
  string template_version_id = 1;
  string prompt = 2;
}
